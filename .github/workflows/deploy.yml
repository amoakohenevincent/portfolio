name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare legacy site
        run: |
          rm -rf dist
          mkdir -p dist
          cp -R public/. dist/
          sed -i \
            -e 's#="/favicon.svg"#="/portfolio/favicon.svg"#g' \
            -e 's#src="/assets/#src="/portfolio/assets/#g' \
            -e 's#href="/assets/#href="/portfolio/assets/#g' \
            -e 's#content="/images/#content="/portfolio/images/#g' \
            dist/index.html
          sed -i 's#"/images/#"/portfolio/images/#g' dist/assets/*.js
          cp dist/index.html dist/404.html
          for route in \
            projects \
            projects/library-management-system \
            projects/tasty-queen-restaurant \
            404
          do
            mkdir -p "dist/$route"
            cp dist/index.html "dist/$route/index.html"
          done

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
